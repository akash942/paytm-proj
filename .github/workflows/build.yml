name: Build on PR

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Building the application with the latest changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup pnpm
        run: npm install -g pnpm
      
      - name: Install Dependencies
        run: pnpm install
        
      - name: Run Build
        run: pnpm run build
